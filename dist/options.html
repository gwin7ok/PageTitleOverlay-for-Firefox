<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Status Title - オプション</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <main>
    <h1>表示位置</h1>
    <form id="posForm">
      <label><input type="radio" name="position" value="left-top"> 左上</label><br>
      <label><input type="radio" name="position" value="right-top"> 右上</label><br>
      <label><input type="radio" name="position" value="left-bottom"> 左下</label><br>
      <label><input type="radio" name="position" value="right-bottom"> 右下</label><br>
      <div class="actions">
        <button id="save">保存</button>
        <span id="status"></span>
      </div>
    </form>
    <h2>色と透明度</h2>
    <form id="colorForm">
      <label>背景色: <input type="color" id="bgColor" name="bgColor" value="#000000"></label><br>
      <label>文字色: <input type="color" id="textColor" name="textColor" value="#ffffff"></label><br>
      <label>透明度: <input type="range" id="alpha" name="alpha" min="0" max="100" value="60"> <span
          id="alphaVal">60</span>%</label>
      <div class="actions">
        <button id="saveColors">保存(色)</button>
        <span id="statusColors"></span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>

</html>
