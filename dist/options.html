<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Status Title - オプション</title>
  <link rel="stylesheet" href="options.css">
</head>

<body>
  <main>
    <div class="actions">
      <label><input type="radio" name="enabled" id="enabled_on" value="1"> 有効</label>
      <label style="margin-left:12px"><input type="radio" name="enabled" id="enabled_off" value="0"> 無効</label>
    </div>
    <div class="font-size-row">
      <label>フォントサイズ（px）: <input type="number" id="fontSize" name="fontSize" min="10" max="36" value="14"></label>
    </div>
    <h1>表示位置</h1>
    <form id="posForm">
      <div class="pos-grid" role="radiogroup" aria-label="表示位置">
        <label class="pos-corner pos-lt"><input type="radio" name="position" value="left-top"> 左上</label>
        <label class="pos-corner pos-rt"><input type="radio" name="position" value="right-top"> 右上</label>
        <label class="pos-corner pos-lb"><input type="radio" name="position" value="left-bottom"> 左下</label>
        <label class="pos-corner pos-rb"><input type="radio" name="position" value="right-bottom"> 右下</label>
      </div>
    </form>
    <h2>色と透明度</h2>
    <form id="colorForm">
      <div class="color-row">
        <label>背景色: <input type="color" id="bgColor" name="bgColor" value="#000000"></label>
        <label class="alpha">背景の透明度: <input type="range" id="bgAlpha" name="bgAlpha" min="0" max="100" value="60"> <span
            id="bgAlphaVal">60</span>%</label>
      </div>
      <div class="color-row">
        <label>文字色: <input type="color" id="textColor" name="textColor" value="#ffffff"></label>
        <label class="alpha">文字の透明度: <input type="range" id="textAlpha" name="textAlpha" min="0" max="100" value="0">
          <span id="textAlphaVal">0</span>%</label>
      </div>
      <div class="actions">
        <button type="button" id="fetchTheme">ブラウザのテーマ色を取得</button>
        <span id="statusFetch"></span>
      </div>
    </form>

    <!-- 統合保存ボタン（画面下部に固定） -->
    <div class="save-all" id="saveAllContainer">
      <button id="saveAll">保存</button>
      <span id="statusAll" style="margin-left:12px"></span>
    </div>
  </main>
  <script src="options.js"></script>
</body>

</html>
